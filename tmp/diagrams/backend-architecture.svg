<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">FareSniper 后端整体架构图</title>
  <desc id="desc">客户端、FastAPI、服务层、领域层与基础设施之间的关系图</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf4"/>
      <stop offset="100%" stop-color="#fffdf9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#fffdf9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#d8c2ae" flood-opacity="0.24"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L13,7 L1,13" fill="none" stroke="#8a6b55" stroke-width="2"/>
    </marker>
    <style>
      .title { font: 700 34px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #4f3422; }
      .subtitle { font: 500 16px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #8a705d; }
      .layer { font: 700 24px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #6a462f; }
      .small-tag { font: 700 12px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #ff7c2a; letter-spacing: 2px; }
      .node-title { font: 700 18px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #4f3422; }
      .node-text { font: 500 14px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #7a6658; }
      .line { stroke: #8a6b55; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #ccb9a7; stroke-width: 2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1180" rx="32" fill="url(#bg)"/>
  <text x="80" y="90" class="title">FareSniper 后端整体架构图</text>
  <text x="80" y="124" class="subtitle">按“接口层 → 服务层 → 领域能力 → 基础设施”整理，主搜索能力由 SearchService 驱动。</text>

  <rect x="90" y="180" width="1620" height="120" rx="30" fill="#ffffff" stroke="#efe1d5" filter="url(#shadow)"/>
  <text x="120" y="228" class="layer">客户端</text>
  <text x="120" y="254" class="small-tag">CLIENT</text>
  <rect x="1280" y="205" width="340" height="70" rx="22" fill="url(#panel)" stroke="#f0dbc8"/>
  <text x="1320" y="248" class="node-title">Frontend / Next.js</text>

  <rect x="90" y="340" width="1620" height="190" rx="32" fill="#ffffff" stroke="#efe1d5" filter="url(#shadow)"/>
  <text x="120" y="388" class="layer">接口层</text>
  <text x="120" y="414" class="small-tag">FASTAPI + ROUTERS</text>
  <rect x="310" y="390" width="260" height="88" rx="24" fill="url(#panel)" stroke="#f0dbc8"/>
  <text x="338" y="427" class="node-title">backend/main.py</text>
  <text x="338" y="452" class="node-text">create_app / lifespan</text>
  <rect x="660" y="390" width="240" height="88" rx="24" fill="#fff" stroke="#ead8ca"/>
  <text x="725" y="427" class="node-title">/search</text>
  <text x="700" y="452" class="node-text">api/search.py</text>
  <rect x="960" y="390" width="240" height="88" rx="24" fill="#fff" stroke="#ead8ca"/>
  <text x="1024" y="427" class="node-title">/memory</text>
  <text x="996" y="452" class="node-text">api/memory.py</text>
  <rect x="1260" y="390" width="320" height="88" rx="24" fill="#fff" stroke="#ead8ca"/>
  <text x="1332" y="427" class="node-title">/recommendations</text>
  <text x="1321" y="452" class="node-text">api/recommendations.py</text>

  <rect x="90" y="570" width="1620" height="190" rx="32" fill="#ffffff" stroke="#efe1d5" filter="url(#shadow)"/>
  <text x="120" y="618" class="layer">服务层</text>
  <text x="120" y="644" class="small-tag">SERVICES</text>
  <rect x="480" y="620" width="350" height="92" rx="26" fill="url(#panel)" stroke="#f0dbc8"/>
  <text x="600" y="658" class="node-title">SearchService</text>
  <text x="540" y="684" class="node-text">搜索、分析、推荐文案组装</text>
  <rect x="950" y="620" width="370" height="92" rx="26" fill="url(#panel)" stroke="#f0dbc8"/>
  <text x="1052" y="658" class="node-title">RecommendationService</text>
  <text x="1007" y="684" class="node-text">记忆读写、推荐卡片聚合</text>

  <rect x="90" y="800" width="1040" height="300" rx="32" fill="#ffffff" stroke="#efe1d5" filter="url(#shadow)"/>
  <text x="120" y="848" class="layer">领域能力层</text>
  <text x="120" y="874" class="small-tag">DOMAIN CAPABILITIES</text>

  <rect x="160" y="910" width="240" height="84" rx="22" fill="#fff8f0" stroke="#f1d3bb"/>
  <text x="217" y="948" class="node-title">UnifiedLLMClient</text>
  <text x="196" y="973" class="node-text">意图解析 / 推荐生成</text>

  <rect x="440" y="910" width="220" height="84" rx="22" fill="#fff8f0" stroke="#f1d3bb"/>
  <text x="484" y="948" class="node-title">DataSourceRegistry</text>
  <text x="497" y="973" class="node-text">数据源分发</text>

  <rect x="700" y="910" width="190" height="84" rx="22" fill="#fff8f0" stroke="#f1d3bb"/>
  <text x="744" y="948" class="node-title">CtripSource</text>
  <text x="735" y="973" class="node-text">航班抓取 / 历史价</text>

  <rect x="160" y="1015" width="300" height="66" rx="20" fill="#fff" stroke="#ead8ca"/>
  <text x="194" y="1056" class="node-title">compare_prices / analyze_history</text>

  <rect x="490" y="1015" width="260" height="66" rx="20" fill="#fff" stroke="#ead8ca"/>
  <text x="535" y="1056" class="node-title">match_preference</text>

  <rect x="780" y="1015" width="250" height="66" rx="20" fill="#fff" stroke="#ead8ca"/>
  <text x="831" y="1056" class="node-title">generate_signals</text>

  <rect x="1180" y="800" width="530" height="300" rx="32" fill="#ffffff" stroke="#efe1d5" filter="url(#shadow)"/>
  <text x="1210" y="848" class="layer">基础设施与记忆</text>
  <text x="1210" y="874" class="small-tag">INFRA + MEMORY</text>

  <rect x="1245" y="910" width="200" height="84" rx="22" fill="#fff8f0" stroke="#f1d3bb"/>
  <text x="1302" y="948" class="node-title">LongTermMemory</text>
  <text x="1296" y="973" class="node-text">偏好 / 查询 / 点击</text>

  <rect x="1480" y="910" width="170" height="84" rx="22" fill="#fff8f0" stroke="#f1d3bb"/>
  <text x="1529" y="948" class="node-title">PostgreSQL</text>
  <text x="1532" y="973" class="node-text">持久化</text>

  <rect x="1245" y="1015" width="170" height="66" rx="20" fill="#fff" stroke="#ead8ca"/>
  <text x="1297" y="1056" class="node-title">Redis</text>

  <rect x="1450" y="1015" width="220" height="66" rx="20" fill="#fff" stroke="#ead8ca"/>
  <text x="1491" y="1056" class="node-title">第三方抓取服务</text>

  <rect x="90" y="1125" width="1620" height="28" rx="14" fill="#f6ece4"/>
  <text x="120" y="1145" style="font:500 13px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#8a705d;">说明：IntentionAgent / OrchestrationAgent / Skill Registry / MemoryManager 已在启动阶段初始化或预留，但当前主接口链路里并未深度接入。</text>

  <path d="M1620 240 L1450 240 L1450 390" class="line"/>
  <path d="M570 434 L660 434" class="line"/>
  <path d="M570 434 L960 434" class="line"/>
  <path d="M570 434 L1260 434" class="line"/>

  <path d="M780 478 L655 620" class="line"/>
  <path d="M1080 478 L1135 620" class="line"/>
  <path d="M1420 478 L1135 620" class="line"/>

  <path d="M655 712 L280 910" class="line"/>
  <path d="M655 712 L550 910" class="line"/>
  <path d="M655 712 L795 910" class="line"/>
  <path d="M655 712 L310 1015" class="line"/>
  <path d="M655 712 L620 1015" class="line"/>
  <path d="M655 712 L905 1015" class="line"/>
  <path d="M655 712 L1245 952" class="line"/>

  <path d="M1135 712 L1245 952" class="line"/>
  <path d="M1445 952 L1480 952" class="line"/>
  <path d="M795 994 L1450 1048" class="soft-line"/>
  <path d="M1330 1015 L1330 994" class="soft-line"/>
</svg>

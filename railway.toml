[[services]]
name = "backend"
# Schema migrations must finish before the API accepts traffic.
startCommand = "alembic -c backend/alembic.ini upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"

[[services]]
name = "worker"
# The worker owns scheduled Ctrip refreshes; do not run this scheduler in the API.
startCommand = "python -m backend.workers.run_all"

[[services]]
name = "frontend"
startCommand = "npm --prefix frontend run start -- -p $PORT"
